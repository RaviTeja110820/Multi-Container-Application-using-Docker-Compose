version: "3.9"

services:

  redis:
    image: redis:alpine
    container_name: redis

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  vote:
    build:
      context: ./vote
      target: final
    container_name: vote
    ports:
      - "5000:80"
    depends_on:
      - redis

  worker:
    build: ./worker
    container_name: worker
    depends_on:
      - redis
      - db

  result:
    build: ./result
    container_name: result
    ports:
      - "5001:80"
    depends_on:
      - db